<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Email Verified</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0d3b66;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding-inline: 90px;
      padding-block: 30px;
      border-radius: 12px;
      box-shadow: 0px 10px 12px rgba(0,0,0,0.50);
      text-align: center;
      max-width: 400px;
    }
    h1 {
      color: #0d3b66;
      margin-bottom: 8px;
    }
    p {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're verified!</h1>
    <p>Your email has been confirmed.<br>You can now log in to the NYIT Club Center.</p>
  </div>
</body>
</html>
